<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="640" fill="#f6f8fa"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">5-Slot Pill Dispenser - Block Wiring</text>

  <!-- legend -->
  <line x1="40" y1="52" x2="75" y2="52" stroke="#d62828" stroke-width="3"/><text x="82" y="56" fill="#1f2937">5 V</text>
  <line x1="130" y1="52" x2="165" y2="52" stroke="#f77f00" stroke-width="3"/><text x="172" y="56" fill="#1f2937">3.3 V</text>
  <line x1="230" y1="52" x2="265" y2="52" stroke="#2a6fdb" stroke-width="3"/><text x="272" y="56" fill="#1f2937">I2C / signals</text>
  <line x1="380" y1="52" x2="415" y2="52" stroke="#444" stroke-width="3" stroke-dasharray="6 3"/><text x="422" y="56" fill="#1f2937">GND (star point)</text>

  <!-- power chain -->
  <rect x="40" y="80" width="120" height="50" rx="6" fill="#fde2e2" stroke="#d62828"/>
  <text x="100" y="102" text-anchor="middle">5V 3A adapter</text><text x="100" y="118" text-anchor="middle" font-size="11">+ barrel jack</text>
  <rect x="200" y="80" width="90" height="50" rx="6" fill="#fde2e2" stroke="#d62828"/>
  <text x="245" y="110" text-anchor="middle">Fuse 2A</text>
  <rect x="330" y="80" width="90" height="50" rx="6" fill="#fde2e2" stroke="#d62828"/>
  <text x="375" y="110" text-anchor="middle">Switch</text>
  <rect x="460" y="80" width="130" height="50" rx="6" fill="#fde2e2" stroke="#d62828"/>
  <text x="525" y="102" text-anchor="middle">Bulk cap</text><text x="525" y="118" text-anchor="middle" font-size="11">470-1000 uF</text>
  <line x1="160" y1="105" x2="200" y2="105" stroke="#d62828" stroke-width="3"/>
  <line x1="290" y1="105" x2="330" y2="105" stroke="#d62828" stroke-width="3"/>
  <line x1="420" y1="105" x2="460" y2="105" stroke="#d62828" stroke-width="3"/>

  <!-- 5V rail -->
  <line x1="40" y1="170" x2="960" y2="170" stroke="#d62828" stroke-width="5"/>
  <text x="46" y="162" fill="#d62828" font-weight="bold">+5 V RAIL</text>
  <line x1="525" y1="130" x2="525" y2="170" stroke="#d62828" stroke-width="3"/>

  <!-- ESP32 -->
  <rect x="330" y="215" width="220" height="150" rx="8" fill="#e8f0fe" stroke="#2a6fdb" stroke-width="2"/>
  <text x="440" y="240" text-anchor="middle" font-weight="bold" font-size="15">ESP32 DevKit V1</text>
  <text x="440" y="262" text-anchor="middle" font-size="12">SDA GPIO21 | SCL GPIO22</text>
  <text x="440" y="280" text-anchor="middle" font-size="12">IR in GPIO27 | Cup GPIO26</text>
  <text x="440" y="298" text-anchor="middle" font-size="12">Btn A GPIO32 | Btn B GPIO33</text>
  <text x="440" y="316" text-anchor="middle" font-size="12">Buzzer GPIO25 | NeoPixel GPIO13</text>
  <text x="440" y="344" text-anchor="middle" font-size="12" fill="#f77f00">3V3 regulator -> 3.3 V rail</text>
  <line x1="440" y1="170" x2="440" y2="215" stroke="#d62828" stroke-width="3"/>
  <text x="448" y="196" font-size="11" fill="#d62828">VIN</text>

  <!-- I2C bus -->
  <line x1="40" y1="410" x2="960" y2="410" stroke="#2a6fdb" stroke-width="4"/>
  <text x="46" y="402" fill="#2a6fdb" font-weight="bold">I2C BUS (3.3 V, 4.7k pull-ups)</text>
  <line x1="440" y1="365" x2="440" y2="410" stroke="#2a6fdb" stroke-width="3"/>

  <!-- I2C devices -->
  <rect x="40" y="440" width="150" height="56" rx="6" fill="#fff" stroke="#2a6fdb"/>
  <text x="115" y="464" text-anchor="middle">MCP23017 #0</text><text x="115" y="482" text-anchor="middle" font-size="11">0x20 (motors 1-4)</text>
  <rect x="210" y="440" width="150" height="56" rx="6" fill="#fff" stroke="#2a6fdb"/>
  <text x="285" y="464" text-anchor="middle">MCP23017 #1</text><text x="285" y="482" text-anchor="middle" font-size="11">0x21 (motor 5)</text>
  <rect x="380" y="440" width="150" height="56" rx="6" fill="#fff" stroke="#2a6fdb"/>
  <text x="455" y="464" text-anchor="middle">DS3231 RTC</text><text x="455" y="482" text-anchor="middle" font-size="11">0x68 + CR2032</text>
  <rect x="550" y="440" width="150" height="56" rx="6" fill="#fff" stroke="#2a6fdb"/>
  <text x="625" y="464" text-anchor="middle">SSD1306 OLED</text><text x="625" y="482" text-anchor="middle" font-size="11">0x3C (optional)</text>
  <g stroke="#2a6fdb" stroke-width="2">
    <line x1="115" y1="410" x2="115" y2="440"/><line x1="285" y1="410" x2="285" y2="440"/>
    <line x1="455" y1="410" x2="455" y2="440"/><line x1="625" y1="410" x2="625" y2="440"/>
  </g>

  <!-- motor drivers -->
  <rect x="40" y="540" width="150" height="70" rx="6" fill="#e9f7ec" stroke="#2e9e4f"/>
  <text x="115" y="560" text-anchor="middle">ULN2003 A, B, C, D</text>
  <text x="115" y="578" text-anchor="middle" font-size="11">GPA0-3, GPA4-7,</text>
  <text x="115" y="594" text-anchor="middle" font-size="11">GPB0-3, GPB4-7 -> motors 1-4</text>
  <rect x="210" y="540" width="150" height="70" rx="6" fill="#e9f7ec" stroke="#2e9e4f"/>
  <text x="285" y="560" text-anchor="middle">ULN2003 E</text>
  <text x="285" y="578" text-anchor="middle" font-size="11">GPA0-3 -> motor 5</text>
  <line x1="115" y1="496" x2="115" y2="540" stroke="#2a6fdb" stroke-width="2"/>
  <line x1="285" y1="496" x2="285" y2="540" stroke="#2a6fdb" stroke-width="2"/>
  <text x="123" y="522" font-size="11" fill="#2a6fdb">IN1-IN4 x4</text>
  <text x="293" y="522" font-size="11" fill="#2a6fdb">IN1-IN4</text>
  <!-- 5V to ULN -->
  <path d="M60 170 V540" stroke="#d62828" stroke-width="2" fill="none" stroke-dasharray="2 0"/>
  <text x="66" y="300" font-size="11" fill="#d62828" transform="rotate(-90 66 300)">5 V to ULN VCC (x5)</text>
  <path d="M340 170 V190 H240 V540" stroke="#d62828" stroke-width="0" fill="none"/>

  <!-- sensors / UI on right -->
  <rect x="640" y="215" width="150" height="46" rx="6" fill="#fff" stroke="#444"/>
  <text x="715" y="235" text-anchor="middle">IR break-beam</text><text x="715" y="251" text-anchor="middle" font-size="11">GPIO27 (active LOW)</text>
  <rect x="640" y="272" width="150" height="40" rx="6" fill="#fff" stroke="#444"/>
  <text x="715" y="297" text-anchor="middle">Cup switch GPIO26</text>
  <rect x="640" y="323" width="150" height="40" rx="6" fill="#fff" stroke="#444"/>
  <text x="715" y="348" text-anchor="middle">Buttons A/B 32/33</text>
  <line x1="550" y1="238" x2="640" y2="238" stroke="#2a6fdb" stroke-width="2"/>
  <line x1="550" y1="292" x2="640" y2="292" stroke="#2a6fdb" stroke-width="2"/>
  <line x1="550" y1="343" x2="640" y2="343" stroke="#2a6fdb" stroke-width="2"/>

  <!-- buzzer & neopixel (left of ESP32 under rail) -->
  <rect x="120" y="215" width="150" height="46" rx="6" fill="#fff" stroke="#444"/>
  <text x="195" y="235" text-anchor="middle">Buzzer (NPN)</text><text x="195" y="251" text-anchor="middle" font-size="11">GPIO25, 5 V</text>
  <rect x="120" y="290" width="150" height="56" rx="6" fill="#fff" stroke="#444"/>
  <text x="195" y="310" text-anchor="middle">NeoPixel strip</text><text x="195" y="326" text-anchor="middle" font-size="11">GPIO13 + 330R, 5 V + 1000uF</text>
  <line x1="270" y1="238" x2="330" y2="238" stroke="#2a6fdb" stroke-width="2"/>
  <line x1="270" y1="318" x2="330" y2="318" stroke="#2a6fdb" stroke-width="2"/>
  <line x1="195" y1="170" x2="195" y2="215" stroke="#d62828" stroke-width="2"/>
  <path d="M230 261 V290" stroke="#d62828" stroke-width="0"/>

  <!-- 3.3V note -->
  <rect x="740" y="440" width="220" height="170" rx="6" fill="#fff4e0" stroke="#f77f00"/>
  <text x="850" y="462" text-anchor="middle" font-weight="bold" fill="#b25c00">3.3 V rail (ESP32 3V3)</text>
  <text x="750" y="486" font-size="12">MCP23017 x2 (RESET to 3V3)</text>
  <text x="750" y="504" font-size="12">DS3231, OLED</text>
  <text x="750" y="522" font-size="12">I2C pull-ups 4.7k</text>
  <text x="750" y="540" font-size="12">IR emitter (100R) / receiver</text>
  <text x="750" y="566" font-size="12" fill="#444">All grounds meet at one</text>
  <text x="750" y="582" font-size="12" fill="#444">star point near the bulk cap.</text>
  <line x1="700" y1="468" x2="740" y2="468" stroke="#f77f00" stroke-width="2"/>

  <!-- GND -->
  <line x1="400" y1="625" x2="960" y2="625" stroke="#444" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="404" y="618" fill="#444">GND star point</text>
</svg>
